<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="980" viewBox="0 0 1480 980" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#152033"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#254a73"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a4d3a"/><stop offset="100%" stop-color="#1f6348"/>
    </linearGradient>
    <linearGradient id="gBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a3420"/><stop offset="100%" stop-color="#5c4228"/>
    </linearGradient>
    <linearGradient id="gPurp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2a55"/><stop offset="100%" stop-color="#4a3670"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f4a5c"/><stop offset="100%" stop-color="#276078"/>
    </linearGradient>
    <linearGradient id="gOk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d5c38"/><stop offset="100%" stop-color="#247a48"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8fa3bf"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 28px ui-sans-serif, system-ui, sans-serif; fill: #f2f6fc; }
      .sub { font: 400 14px ui-sans-serif, system-ui, sans-serif; fill: #8fa3bf; }
      .boxh { font: 700 15px ui-sans-serif, system-ui, sans-serif; fill: #f2f6fc; }
      .boxs { font: 400 12px ui-sans-serif, system-ui, sans-serif; fill: #b8c7da; }
      .mono { font: 500 12px ui-monospace, Menlo, monospace; fill: #c9d6e8; }
      .stage { font: 700 12px ui-sans-serif, system-ui, sans-serif; fill: #7d93ad; letter-spacing: 0.06em; }
      .ok { font: 700 13px ui-sans-serif, system-ui, sans-serif; fill: #7dffb0; }
      .emph { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: #e8c48a; }
      .big { font: 700 17px ui-sans-serif, system-ui, sans-serif; fill: #f2f6fc; }
      .tiny { font: 400 11px ui-sans-serif, system-ui, sans-serif; fill: #8fa3bf; }
      .hero { font: 700 20px ui-sans-serif, system-ui, sans-serif; fill: #7dffb0; }
    </style>
  </defs>

  <rect width="1480" height="980" fill="url(#bg)"/>
  <text x="48" y="42" class="title">How PE-Core Is Pretrained</text>
  <text x="48" y="68" class="sub">Contrastive vision–language learning · image scale first · video refinement second</text>

  <!-- Objective banner -->
  <rect x="48" y="88" width="1384" height="56" rx="12" fill="#141e2c" stroke="#3a4f68"/>
  <text x="68" y="122" class="emph">Objective:</text>
  <text x="170" y="122" class="boxs">CLIP-style contrastive loss — pull matching image/video ↔ text pairs, push non-matches (InfoNCE / cosine + logit scale)</text>

  <!-- STAGE 1 -->
  <text x="48" y="178" class="stage">STAGE 1 · IMAGE PRETRAINING</text>

  <g filter="url(#soft)">
    <rect x="48" y="194" width="280" height="160" rx="14" fill="url(#gBlue)" stroke="#5a7eab"/>
    <text x="68" y="228" class="boxh">Image data</text>
    <text x="68" y="258" class="ok">~5.4B image–alt-text</text>
    <text x="68" y="282" class="boxs">public pairs, MetaCLIP</text>
    <text x="68" y="304" class="boxs">text-only curation</text>
    <text x="68" y="330" class="tiny">~58–86B samples seen</text>
  </g>

  <g filter="url(#soft)">
    <rect x="348" y="194" width="280" height="160" rx="14" fill="url(#gBrown)" stroke="#a07848"/>
    <text x="368" y="228" class="boxh">Text data</text>
    <text x="368" y="258" class="boxs">Web alt-text / captions</text>
    <text x="368" y="282" class="boxs">noisy but huge scale</text>
    <text x="368" y="304" class="boxs">curated for quality</text>
    <text x="368" y="330" class="tiny">paired with each image</text>
  </g>

  <g filter="url(#soft)">
    <rect x="648" y="194" width="380" height="160" rx="14" fill="url(#gPurp)" stroke="#7a62a0"/>
    <text x="668" y="228" class="boxh">What is learned</text>
    <text x="668" y="258" class="boxs">Vision tower ↔ text tower</text>
    <text x="668" y="282" class="boxs">shared embedding space</text>
    <text x="668" y="304" class="ok">zero-shot image retrieval</text>
    <text x="668" y="330" class="ok">&amp; classification foundation</text>
  </g>

  <g filter="url(#soft)">
    <rect x="1048" y="194" width="384" height="160" rx="14" fill="url(#gTeal)" stroke="#4a8aa0"/>
    <text x="1068" y="228" class="boxh">Key image optimizations</text>
    <text x="1068" y="258" class="boxs">• Progressive resolution (98→…→448)</text>
    <text x="1068" y="280" class="boxs">• Huge batch (up to ~131K)</text>
    <text x="1068" y="302" class="boxs">• LAMB optimizer (vs AdamW)</text>
    <text x="1068" y="324" class="boxs">• Augmentation + mask regularization</text>
  </g>

  <!-- STAGE 2 video engine -->
  <text x="48" y="392" class="stage">STAGE 2 · VIDEO DATA ENGINE  (create aligned video–text)</text>

  <g filter="url(#soft)">
    <rect x="48" y="408" width="220" height="130" rx="14" fill="url(#gBlue)" stroke="#5a7eab"/>
    <text x="158" y="448" text-anchor="middle" class="boxh">Raw videos</text>
    <text x="158" y="474" text-anchor="middle" class="boxs">~22M clips</text>
    <text x="158" y="498" text-anchor="middle" class="tiny">+ titles / metadata</text>
  </g>
  <line x1="268" y1="473" x2="304" y2="473" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>

  <g filter="url(#soft)">
    <rect x="308" y="408" width="280" height="130" rx="14" fill="url(#gBrown)" stroke="#a07848"/>
    <text x="448" y="440" text-anchor="middle" class="boxh">Caption sources</text>
    <text x="448" y="468" text-anchor="middle" class="boxs">video captioner (PE+LLM)</text>
    <text x="448" y="490" text-anchor="middle" class="boxs">per-frame image captions</text>
    <text x="448" y="512" text-anchor="middle" class="boxs">+ human-refined set</text>
  </g>
  <line x1="588" y1="473" x2="624" y2="473" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>

  <g filter="url(#soft)">
    <rect x="628" y="408" width="280" height="130" rx="14" fill="url(#gPurp)" stroke="#7a62a0"/>
    <text x="768" y="448" text-anchor="middle" class="boxh">LLM synthesizes</text>
    <text x="768" y="474" text-anchor="middle" class="boxs">dense short captions</text>
    <text x="768" y="498" text-anchor="middle" class="tiny">aligned video–text pairs</text>
  </g>
  <line x1="908" y1="473" x2="944" y2="473" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>

  <g filter="url(#soft)">
    <rect x="948" y="408" width="484" height="130" rx="14" fill="url(#gOk)" stroke="#4e9a6e"/>
    <text x="1190" y="448" text-anchor="middle" class="boxh">Why this matters</text>
    <text x="1190" y="474" text-anchor="middle" class="boxs">Native video–text on the web is scarce / noisy</text>
    <text x="1190" y="498" text-anchor="middle" class="boxs">Engine creates high-quality supervision at scale</text>
  </g>

  <!-- STAGE 3 video FT -->
  <text x="48" y="580" class="stage">STAGE 3 · VIDEO FINETUNING  (same contrastive objective)</text>

  <g filter="url(#soft)">
    <rect x="48" y="596" width="340" height="140" rx="14" fill="url(#gBlue)" stroke="#5a7eab"/>
    <text x="68" y="630" class="boxh">Video → embedding</text>
    <text x="68" y="660" class="boxs">Sample 8 frames per clip</text>
    <text x="68" y="682" class="boxs">Encode each with PE</text>
    <text x="68" y="704" class="ok">Mean-pool → one video vector</text>
  </g>

  <g filter="url(#soft)">
    <rect x="408" y="596" width="340" height="140" rx="14" fill="url(#gBrown)" stroke="#a07848"/>
    <text x="428" y="630" class="boxh">Text → embedding</text>
    <text x="428" y="660" class="boxs">Engine caption for the clip</text>
    <text x="428" y="682" class="boxs">Same text tower</text>
    <text x="428" y="704" class="ok">Align video ↔ caption</text>
  </g>

  <g filter="url(#soft)">
    <rect x="768" y="596" width="664" height="140" rx="14" fill="url(#gTeal)" stroke="#4a8aa0"/>
    <text x="788" y="630" class="boxh">Video-stage optimizations</text>
    <text x="788" y="660" class="boxs">• Short cooldown on images (~50M) then ~22M videos</text>
    <text x="788" y="682" class="boxs">• Smaller LR &amp; batch than image pretrain · max resolution</text>
    <text x="788" y="704" class="boxs">• Distill G → L/B for smaller PE-Core models</text>
  </g>

  <!-- Bottom result -->
  <rect x="48" y="770" width="1384" height="170" rx="16" fill="#101824" stroke="#2a3c52"/>
  <text x="68" y="808" class="stage">RESULT</text>
  <text x="68" y="844" class="hero">One joint image–video encoder (PE-Core)</text>
  <text x="68" y="878" class="boxs">Image scale teaches broad perception · video finetune teaches temporal/event language without full video attention</text>
  <text x="68" y="906" class="tiny">Later: language / spatial alignment (PE-Lang, PE-Spatial) reuse these features for MLLM and dense tasks — not part of this contrastive pretrain.</text>
</svg>
