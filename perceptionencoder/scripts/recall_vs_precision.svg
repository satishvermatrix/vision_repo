<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="900" viewBox="0 0 1480 900" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#152033"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#254a73"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a4d3a"/><stop offset="100%" stop-color="#1f6348"/>
    </linearGradient>
    <linearGradient id="gBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a3420"/><stop offset="100%" stop-color="#5c4228"/>
    </linearGradient>
    <linearGradient id="gPurp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2a55"/><stop offset="100%" stop-color="#4a3670"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f4a5c"/><stop offset="100%" stop-color="#276078"/>
    </linearGradient>
    <linearGradient id="gOk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d5c38"/><stop offset="100%" stop-color="#247a48"/>
    </linearGradient>
    <linearGradient id="gBad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5c2a2a"/><stop offset="100%" stop-color="#7a3434"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8fa3bf"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 28px ui-sans-serif, system-ui, sans-serif; fill: #f2f6fc; }
      .sub { font: 400 14px ui-sans-serif, system-ui, sans-serif; fill: #8fa3bf; }
      .boxh { font: 700 15px ui-sans-serif, system-ui, sans-serif; fill: #f2f6fc; }
      .boxs { font: 400 12px ui-sans-serif, system-ui, sans-serif; fill: #b8c7da; }
      .mono { font: 500 12px ui-monospace, Menlo, monospace; fill: #c9d6e8; }
      .stage { font: 700 12px ui-sans-serif, system-ui, sans-serif; fill: #7d93ad; letter-spacing: 0.06em; }
      .ok { font: 700 13px ui-sans-serif, system-ui, sans-serif; fill: #7dffb0; }
      .bad { font: 700 13px ui-sans-serif, system-ui, sans-serif; fill: #ff9b9b; }
      .emph { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: #e8c48a; }
      .big { font: 700 18px ui-sans-serif, system-ui, sans-serif; fill: #f2f6fc; }
      .tiny { font: 400 11px ui-sans-serif, system-ui, sans-serif; fill: #8fa3bf; }
      .hero { font: 700 22px ui-sans-serif, system-ui, sans-serif; fill: #7dffb0; }
    </style>
  </defs>

  <rect width="1480" height="900" fill="url(#bg)"/>
  <text x="48" y="42" class="title">Recall vs Precision in the Cascade</text>
  <text x="48" y="68" class="sub">Where each matters · what FP / FN mean · how we handle them</text>

  <!-- Pipeline strip -->
  <text x="48" y="108" class="stage">PIPELINE</text>
  <g filter="url(#soft)">
    <rect x="48" y="122" width="280" height="70" rx="12" fill="url(#gBlue)" stroke="#5a7eab"/>
    <text x="188" y="152" text-anchor="middle" class="boxh">All chunks</text>
    <text x="188" y="174" text-anchor="middle" class="tiny">full index</text>
  </g>
  <line x1="328" y1="157" x2="364" y2="157" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>
  <g filter="url(#soft)">
    <rect x="368" y="122" width="320" height="70" rx="12" fill="url(#gGreen)" stroke="#4e9a6e"/>
    <text x="528" y="152" text-anchor="middle" class="boxh">PE retrieve</text>
    <text x="528" y="174" text-anchor="middle" class="hero">HIGH RECALL</text>
  </g>
  <line x1="688" y1="157" x2="724" y2="157" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>
  <g filter="url(#soft)">
    <rect x="728" y="122" width="320" height="70" rx="12" fill="url(#gTeal)" stroke="#4a8aa0"/>
    <text x="888" y="152" text-anchor="middle" class="boxh">VLM verify</text>
    <text x="888" y="174" text-anchor="middle" class="hero">HIGH PRECISION</text>
  </g>
  <line x1="1048" y1="157" x2="1084" y2="157" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>
  <g filter="url(#soft)">
    <rect x="1088" y="122" width="344" height="70" rx="12" fill="url(#gOk)" stroke="#4e9a6e"/>
    <text x="1260" y="152" text-anchor="middle" class="boxh">Confirmed events</text>
    <text x="1260" y="174" text-anchor="middle" class="tiny">report + clips</text>
  </g>

  <!-- Two columns: recall stage / precision stage -->
  <g filter="url(#soft)">
    <rect x="48" y="220" width="680" height="280" rx="16" fill="#101824" stroke="#3d7a55" stroke-width="2"/>
    <text x="68" y="256" class="stage">STAGE 1 — PE  ·  OPTIMIZE RECALL</text>
    <text x="68" y="290" class="big">Don’t miss real events</text>
    <text x="68" y="324" class="boxs">Goal: real fights / falls / crowds make the shortlist</text>
    <text x="68" y="356" class="ok">Acceptable: extra false positives</text>
    <text x="68" y="388" class="bad">Costly: false negatives (never sent to VLM)</text>
    <text x="68" y="428" class="emph">Levers</text>
    <text x="68" y="456" class="boxs">• Prompt ensemble (max)  ·  lower min_pe_score  ·  larger top-k</text>
    <text x="68" y="480" class="tiny">FN here is almost unrecoverable downstream</text>
  </g>

  <g filter="url(#soft)">
    <rect x="752" y="220" width="680" height="280" rx="16" fill="#101824" stroke="#4a8aa0" stroke-width="2"/>
    <text x="772" y="256" class="stage">STAGE 2 — VLM  ·  OPTIMIZE PRECISION</text>
    <text x="772" y="290" class="big">Don’t confirm lookalikes</text>
    <text x="772" y="324" class="boxs">Goal: only true events marked confirmed</text>
    <text x="772" y="356" class="ok">Acceptable: reject borderline cases</text>
    <text x="772" y="388" class="bad">Costly: false positives in final report</text>
    <text x="772" y="428" class="emph">Levers</text>
    <text x="772" y="456" class="boxs">• Strict definition  ·  higher confirm_threshold  ·  rationale check</text>
    <text x="772" y="480" class="tiny">FP here becomes a false alarm to the user</text>
  </g>

  <!-- FP / FN handling -->
  <text x="48" y="540" class="stage">DEALING WITH FP AND FN</text>

  <g filter="url(#soft)">
    <rect x="48" y="556" width="340" height="200" rx="14" fill="url(#gBrown)" stroke="#a07848"/>
    <text x="68" y="592" class="boxh">PE false negative</text>
    <text x="68" y="620" class="bad">Real event never retrieved</text>
    <text x="68" y="652" class="boxs">Fix upstream:</text>
    <text x="68" y="676" class="boxs">add prompts · drop PE threshold</text>
    <text x="68" y="700" class="boxs">raise k · check chunking</text>
    <text x="68" y="728" class="tiny">VLM cannot see what PE dropped</text>
  </g>

  <g filter="url(#soft)">
    <rect x="408" y="556" width="340" height="200" rx="14" fill="url(#gPurp)" stroke="#7a62a0"/>
    <text x="428" y="592" class="boxh">PE false positive</text>
    <text x="428" y="620" class="emph">Lookalike in shortlist</text>
    <text x="428" y="652" class="boxs">Expected — handle later:</text>
    <text x="428" y="676" class="boxs">send to VLM verify</text>
    <text x="428" y="700" class="boxs">export as fp_* if rejected</text>
    <text x="428" y="728" class="tiny">OK if volume stays small</text>
  </g>

  <g filter="url(#soft)">
    <rect x="768" y="556" width="340" height="200" rx="14" fill="url(#gTeal)" stroke="#4a8aa0"/>
    <text x="788" y="592" class="boxh">VLM false positive</text>
    <text x="788" y="620" class="bad">Wrongly confirmed</text>
    <text x="788" y="652" class="boxs">Fix downstream:</text>
    <text x="788" y="676" class="boxs">tighten definition</text>
    <text x="788" y="700" class="boxs">raise confidence floor</text>
    <text x="788" y="728" class="tiny">review rationale / human audit</text>
  </g>

  <g filter="url(#soft)">
    <rect x="1128" y="556" width="304" height="200" rx="14" fill="url(#gGreen)" stroke="#4e9a6e"/>
    <text x="1148" y="592" class="boxh">VLM false negative</text>
    <text x="1148" y="620" class="emph">True event rejected</text>
    <text x="1148" y="652" class="boxs">Fix carefully:</text>
    <text x="1148" y="676" class="boxs">soften threshold a bit</text>
    <text x="1148" y="700" class="boxs">improve frames / prompt</text>
    <text x="1148" y="728" class="tiny">trade vs more final FPs</text>
  </g>

  <!-- Bottom rule -->
  <rect x="48" y="780" width="1384" height="90" rx="14" fill="#141e2c" stroke="#3a4f68"/>
  <text x="68" y="818" class="big">Rule of thumb</text>
  <text x="68" y="848" class="boxs">Bias PE toward recall (catch candidates). Bias VLM toward precision (trust the final label). Tune FP/FN where the error is cheapest to fix.</text>
</svg>
