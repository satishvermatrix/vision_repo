<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="videosearch system architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1218"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#8fa3bf"/>
    </marker>
    <style>
      .title { font: 700 26px ui-sans-serif, system-ui, sans-serif; fill: #eef3fa; }
      .sub { font: 400 14px ui-sans-serif, system-ui, sans-serif; fill: #8fa3bf; }
      .h { font: 700 13px ui-sans-serif, system-ui, sans-serif; fill: #eef3fa; }
      .t { font: 500 12px ui-sans-serif, system-ui, sans-serif; fill: #d5deeb; }
      .s { font: 400 11px ui-sans-serif, system-ui, sans-serif; fill: #8fa3bf; }
      .mono { font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #c9d6e8; }
      .box { stroke-width: 1.4; rx: 10; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="48" y="48" class="title">videosearch - System Architecture</text>
  <text x="48" y="72" class="sub">NLQ video search with Meta PE-Core CLIP / perceptionencoder</text>

  <rect x="48" y="100" width="200" height="120" class="box" fill="#152033" stroke="#3a5273"/>
  <text x="64" y="124" class="h">INPUTS</text>
  <rect x="64" y="140" width="168" height="30" rx="6" fill="#1b2a40" stroke="#456189"/>
  <text x="76" y="160" class="mono">videos/*.mp4</text>
  <rect x="64" y="178" width="168" height="30" rx="6" fill="#1b2a40" stroke="#456189"/>
  <text x="76" y="198" class="mono">NLQ text query</text>

  <rect x="300" y="115" width="220" height="90" class="box" fill="#1a2f24" stroke="#3d7a55"/>
  <text x="316" y="140" class="h">cli.py</text>
  <text x="316" y="162" class="t">videosearch index</text>
  <text x="316" y="182" class="t">videosearch search</text>

  <line x1="248" y1="160" x2="300" y2="160" stroke="#8fa3bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="560" y="100" width="360" height="280" class="box" fill="#182338" stroke="#3a5273"/>
  <text x="576" y="124" class="h">APPLICATION CORE</text>

  <rect x="580" y="144" width="150" height="55" rx="8" fill="#243449" stroke="#507094"/>
  <text x="596" y="168" class="mono">chunker.py</text>
  <text x="596" y="186" class="s">windows + frames</text>

  <rect x="750" y="144" width="150" height="55" rx="8" fill="#243449" stroke="#507094"/>
  <text x="766" y="168" class="mono">indexer.py</text>
  <text x="766" y="186" class="s">build index</text>

  <rect x="580" y="220" width="150" height="55" rx="8" fill="#243449" stroke="#507094"/>
  <text x="596" y="244" class="mono">search.py</text>
  <text x="596" y="262" class="s">cosine top-k</text>

  <rect x="750" y="220" width="150" height="55" rx="8" fill="#1a3d2a" stroke="#3d7a55"/>
  <text x="766" y="244" class="mono">pe_model.py</text>
  <text x="766" y="262" class="s">PE-Core wrapper</text>

  <text x="580" y="310" class="s">index: chunker -&gt; pe_model -&gt; save</text>
  <text x="580" y="330" class="s">search: pe_model text -&gt; cosine vs index</text>
  <text x="580" y="355" class="s">__init__.py exports PEModel</text>

  <line x1="520" y1="160" x2="560" y2="160" stroke="#8fa3bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="980" y="100" width="372" height="280" class="box" fill="#2a1f18" stroke="#8a5a35"/>
  <text x="996" y="124" class="h">PERCEPTION ENCODER STACK</text>

  <rect x="1000" y="144" width="332" height="48" rx="8" fill="#3a2a1e" stroke="#a06d42"/>
  <text x="1016" y="164" class="mono">vendor/perception_models</text>
  <text x="1016" y="182" class="s">core.vision_encoder architecture code</text>

  <rect x="1000" y="208" width="332" height="48" rx="8" fill="#3a2a1e" stroke="#a06d42"/>
  <text x="1016" y="228" class="mono">PE-Core-L14-336.pt</text>
  <text x="1016" y="246" class="s">~671M params / vision + text towers</text>

  <rect x="1000" y="272" width="332" height="48" rx="8" fill="#3a2a1e" stroke="#a06d42"/>
  <text x="1016" y="292" class="mono">transforms + BPE vocab</text>
  <text x="1016" y="310" class="s">336px image prep / text tokenizer</text>

  <text x="1000" y="350" class="s">Shared 1024-d embedding space</text>

  <line x1="900" y1="248" x2="980" y2="248" stroke="#8fa3bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="48" y="420" width="440" height="150" class="box" fill="#152033" stroke="#3a5273"/>
  <text x="64" y="444" class="h">RUNTIME</text>
  <rect x="64" y="460" width="190" height="90" rx="8" fill="#243449" stroke="#507094"/>
  <text x="80" y="490" class="t">CPU</text>
  <text x="80" y="512" class="s">OpenCV decode / seek</text>
  <text x="80" y="530" class="s">PIL + preprocess</text>
  <rect x="274" y="460" width="190" height="90" rx="8" fill="#1a3d2a" stroke="#3d7a55"/>
  <text x="290" y="490" class="t">GPU (GB10)</text>
  <text x="290" y="512" class="s">encode_image</text>
  <text x="290" y="530" class="s">encode_text (bf16)</text>

  <rect x="520" y="420" width="400" height="150" class="box" fill="#1a2438" stroke="#3a5273"/>
  <text x="536" y="444" class="h">ON-DISK INDEX</text>
  <rect x="536" y="460" width="360" height="28" rx="6" fill="#243449" stroke="#507094"/>
  <text x="548" y="479" class="mono">embeddings.npy   N x 1024 float32</text>
  <rect x="536" y="498" width="360" height="28" rx="6" fill="#243449" stroke="#507094"/>
  <text x="548" y="517" class="mono">chunks.json       video, start, end</text>
  <rect x="536" y="536" width="360" height="28" rx="6" fill="#243449" stroke="#507094"/>
  <text x="548" y="555" class="mono">config.json       model + chunk settings</text>

  <rect x="960" y="420" width="392" height="150" class="box" fill="#152033" stroke="#3a5273"/>
  <text x="976" y="444" class="h">OUTPUTS</text>
  <rect x="976" y="460" width="360" height="44" rx="8" fill="#1a3d2a" stroke="#3d7a55"/>
  <text x="992" y="480" class="t">Ranked chunks</text>
  <text x="992" y="496" class="s">score / video / [start-end]</text>
  <rect x="976" y="516" width="360" height="40" rx="8" fill="#243449" stroke="#507094"/>
  <text x="992" y="542" class="t">Optional ffmpeg clip export</text>

  <line x1="280" y1="380" x2="200" y2="420" stroke="#8fa3bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="380" x2="700" y2="420" stroke="#8fa3bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="820" y1="380" x2="1100" y2="420" stroke="#8fa3bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="48" y="600" width="1304" height="260" class="box" fill="#121926" stroke="#2d3f58"/>
  <text x="64" y="628" class="h">DATA FLOWS</text>

  <text x="64" y="660" class="t">INDEX (once)</text>
  <rect x="64" y="676" width="120" height="36" rx="6" fill="#243449" stroke="#507094"/>
  <text x="76" y="698" class="mono">videos</text>
  <line x1="184" y1="694" x2="210" y2="694" stroke="#8fa3bf" marker-end="url(#arrow)"/>
  <rect x="210" y="676" width="130" height="36" rx="6" fill="#243449" stroke="#507094"/>
  <text x="222" y="698" class="mono">chunker</text>
  <line x1="340" y1="694" x2="366" y2="694" stroke="#8fa3bf" marker-end="url(#arrow)"/>
  <rect x="366" y="676" width="150" height="36" rx="6" fill="#1a3d2a" stroke="#3d7a55"/>
  <text x="378" y="698" class="mono">PE vision</text>
  <line x1="516" y1="694" x2="542" y2="694" stroke="#8fa3bf" marker-end="url(#arrow)"/>
  <rect x="542" y="676" width="200" height="36" rx="6" fill="#243449" stroke="#507094"/>
  <text x="554" y="698" class="mono">embeddings.npy</text>

  <text x="64" y="750" class="t">SEARCH (many)</text>
  <rect x="64" y="766" width="120" height="36" rx="6" fill="#243449" stroke="#507094"/>
  <text x="76" y="788" class="mono">NLQ</text>
  <line x1="184" y1="784" x2="210" y2="784" stroke="#8fa3bf" marker-end="url(#arrow)"/>
  <rect x="210" y="766" width="150" height="36" rx="6" fill="#1a3d2a" stroke="#3d7a55"/>
  <text x="222" y="788" class="mono">PE text</text>
  <line x1="360" y1="784" x2="386" y2="784" stroke="#8fa3bf" marker-end="url(#arrow)"/>
  <rect x="386" y="766" width="170" height="36" rx="6" fill="#243449" stroke="#507094"/>
  <text x="398" y="788" class="mono">cosine vs index</text>
  <line x1="556" y1="784" x2="582" y2="784" stroke="#8fa3bf" marker-end="url(#arrow)"/>
  <rect x="582" y="766" width="200" height="36" rx="6" fill="#1a3d2a" stroke="#3d7a55"/>
  <text x="594" y="788" class="mono">top-k chunks</text>

  <text x="64" y="840" class="s">Files: src/videosearch/{cli,chunker,indexer,search,pe_model}.py / vendor/perception_models / data/index* / .hf_home/*.pt</text>
</svg>
