<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="920" viewBox="0 0 1480 920" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#152033"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#254a73"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a4d3a"/><stop offset="100%" stop-color="#1f6348"/>
    </linearGradient>
    <linearGradient id="gBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a3420"/><stop offset="100%" stop-color="#5c4228"/>
    </linearGradient>
    <linearGradient id="gPurp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2a55"/><stop offset="100%" stop-color="#4a3670"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f4a5c"/><stop offset="100%" stop-color="#276078"/>
    </linearGradient>
    <linearGradient id="gOk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d5c38"/><stop offset="100%" stop-color="#247a48"/>
    </linearGradient>
    <linearGradient id="gBad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5c2a2a"/><stop offset="100%" stop-color="#7a3434"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8fa3bf"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 28px ui-sans-serif, system-ui, sans-serif; fill: #f2f6fc; }
      .sub { font: 400 14px ui-sans-serif, system-ui, sans-serif; fill: #8fa3bf; }
      .boxh { font: 700 15px ui-sans-serif, system-ui, sans-serif; fill: #f2f6fc; }
      .boxs { font: 400 12px ui-sans-serif, system-ui, sans-serif; fill: #b8c7da; }
      .mono { font: 500 12px ui-monospace, Menlo, monospace; fill: #c9d6e8; }
      .stage { font: 700 12px ui-sans-serif, system-ui, sans-serif; fill: #7d93ad; letter-spacing: 0.06em; }
      .ok { font: 700 13px ui-sans-serif, system-ui, sans-serif; fill: #7dffb0; }
      .bad { font: 700 13px ui-sans-serif, system-ui, sans-serif; fill: #ff9b9b; }
      .emph { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: #e8c48a; }
      .big { font: 700 17px ui-sans-serif, system-ui, sans-serif; fill: #f2f6fc; }
      .tiny { font: 400 11px ui-sans-serif, system-ui, sans-serif; fill: #8fa3bf; }
      .num { font: 700 22px ui-sans-serif, system-ui, sans-serif; fill: #e8c48a; }
    </style>
  </defs>

  <rect width="1480" height="920" fill="url(#bg)"/>
  <text x="48" y="42" class="title">Why a Cascaded Approach?</text>
  <text x="48" y="68" class="sub">PE-Core retrieval for scale + VLM verification for judgment — neither alone is enough</text>

  <!-- Problem statement -->
  <rect x="48" y="90" width="1384" height="70" rx="14" fill="#141e2c" stroke="#3a4f68"/>
  <text x="68" y="122" class="emph">Problem</text>
  <text x="68" y="144" class="boxs">Search thousands of video chunks for rare events (fight, fall, crowd…) — need high recall at index scale AND low false positives in the final answer.</text>

  <!-- Three failed paths -->
  <text x="48" y="196" class="stage">IF YOU USE ONLY ONE MODEL</text>

  <!-- Only PE -->
  <g filter="url(#soft)">
    <rect x="48" y="214" width="440" height="200" rx="16" fill="url(#gBad)" stroke="#a05050"/>
    <text x="68" y="248" class="boxh">A. PE-Core only</text>
    <text x="68" y="278" class="ok">✓ Fast · index once · cosine search</text>
    <text x="68" y="302" class="ok">✓ High recall over large corpora</text>
    <text x="68" y="334" class="bad">✗ Similarity ≠ understanding</text>
    <text x="68" y="358" class="bad">✗ Crowd / sports can score like “fight”</text>
    <text x="68" y="382" class="tiny">No rationale · many false positives</text>
  </g>

  <!-- Only VLM -->
  <g filter="url(#soft)">
    <rect x="520" y="214" width="440" height="200" rx="16" fill="url(#gBad)" stroke="#a05050"/>
    <text x="540" y="248" class="boxh">B. VLM only</text>
    <text x="540" y="278" class="ok">✓ Can judge present / explain why</text>
    <text x="540" y="302" class="ok">✓ Good for VQA-style verification</text>
    <text x="540" y="334" class="bad">✗ Too slow / expensive on every chunk</text>
    <text x="540" y="358" class="bad">✗ Doesn’t build a reusable search index</text>
    <text x="540" y="382" class="tiny">Doesn’t scale to full video corpora</text>
  </g>

  <!-- Wishful -->
  <g filter="url(#soft)">
    <rect x="992" y="214" width="440" height="200" rx="16" fill="#2a2430" stroke="#6a5080"/>
    <text x="1012" y="248" class="boxh">C. “One model for both”</text>
    <text x="1012" y="278" class="boxs">Ideal in theory — rare in practice:</text>
    <text x="1012" y="306" class="boxs">global vectors optimize matching;</text>
    <text x="1012" y="330" class="boxs">decoders optimize token generation.</text>
    <text x="1012" y="362" class="emph">Different jobs → different tools</text>
    <text x="1012" y="386" class="tiny">(PE-Lang helps VLM path, not ANN search)</text>
  </g>

  <!-- Cascade solution -->
  <text x="48" y="450" class="stage">CASCADED SOLUTION</text>

  <g filter="url(#soft)">
    <rect x="48" y="468" width="280" height="130" rx="14" fill="url(#gBlue)" stroke="#5a7eab"/>
    <text x="188" y="508" text-anchor="middle" class="num">1</text>
    <text x="188" y="536" text-anchor="middle" class="boxh">All video chunks</text>
    <text x="188" y="560" text-anchor="middle" class="boxs">large corpus</text>
    <text x="188" y="580" text-anchor="middle" class="tiny">~thousands of windows</text>
  </g>
  <line x1="328" y1="533" x2="364" y2="533" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>

  <g filter="url(#soft)">
    <rect x="368" y="468" width="300" height="130" rx="14" fill="url(#gGreen)" stroke="#4e9a6e"/>
    <text x="518" y="508" text-anchor="middle" class="num">2</text>
    <text x="518" y="536" text-anchor="middle" class="boxh">PE-Core retrieve</text>
    <text x="518" y="560" text-anchor="middle" class="boxs">cosine top-k · high recall</text>
    <text x="518" y="580" text-anchor="middle" class="tiny">cheap · GPU / batched</text>
  </g>
  <line x1="668" y1="533" x2="704" y2="533" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>

  <g filter="url(#soft)">
    <rect x="708" y="468" width="300" height="130" rx="14" fill="url(#gPurp)" stroke="#7a62a0"/>
    <text x="858" y="508" text-anchor="middle" class="num">3</text>
    <text x="858" y="536" text-anchor="middle" class="boxh">Shortlist only</text>
    <text x="858" y="560" text-anchor="middle" class="boxs">e.g. top 5–20 candidates</text>
    <text x="858" y="580" text-anchor="middle" class="tiny">may include false positives</text>
  </g>
  <line x1="1008" y1="533" x2="1044" y2="533" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>

  <g filter="url(#soft)">
    <rect x="1048" y="468" width="384" height="130" rx="14" fill="url(#gTeal)" stroke="#4a8aa0"/>
    <text x="1240" y="508" text-anchor="middle" class="num">4</text>
    <text x="1240" y="536" text-anchor="middle" class="boxh">VLM verify</text>
    <text x="1240" y="560" text-anchor="middle" class="boxs">present? confidence? why?</text>
    <text x="1240" y="580" text-anchor="middle" class="tiny">precision · reject FPs</text>
  </g>

  <!-- Benefits row -->
  <rect x="48" y="630" width="1384" height="250" rx="16" fill="#101824" stroke="#2a3c52"/>
  <text x="68" y="666" class="stage">WHAT THE CASCADE BUYS YOU</text>

  <g filter="url(#soft)">
    <rect x="68" y="688" width="320" height="160" rx="12" fill="#121a26" stroke="#3a5a78"/>
    <text x="88" y="724" class="boxh">Scale</text>
    <text x="88" y="754" class="boxs">Index &amp; search millions of</text>
    <text x="88" y="776" class="boxs">frame-windows with PE</text>
    <text x="88" y="798" class="boxs">without calling a VLM</text>
    <text x="88" y="820" class="boxs">on every chunk</text>
  </g>

  <g filter="url(#soft)">
    <rect x="412" y="688" width="320" height="160" rx="12" fill="#121a26" stroke="#3a5a78"/>
    <text x="432" y="724" class="boxh">Precision</text>
    <text x="432" y="754" class="boxs">VLM applies event definition</text>
    <text x="432" y="776" class="boxs">and filters lookalikes</text>
    <text x="432" y="798" class="boxs">(crowd ≠ fight)</text>
    <text x="432" y="820" class="ok">fewer false alarms</text>
  </g>

  <g filter="url(#soft)">
    <rect x="756" y="688" width="320" height="160" rx="12" fill="#121a26" stroke="#3a5a78"/>
    <text x="776" y="724" class="boxh">Explainability</text>
    <text x="776" y="754" class="boxs">Similarity score alone is opaque.</text>
    <text x="776" y="776" class="boxs">VLM returns rationale</text>
    <text x="776" y="798" class="boxs">for confirm / reject</text>
    <text x="776" y="820" class="tiny">auditable decisions</text>
  </g>

  <g filter="url(#soft)">
    <rect x="1100" y="688" width="308" height="160" rx="12" fill="url(#gOk)" stroke="#4e9a6e"/>
    <text x="1120" y="724" class="boxh">Bottom line</text>
    <text x="1120" y="756" class="boxs">PE = recall engine</text>
    <text x="1120" y="778" class="boxs">VLM = judgment engine</text>
    <text x="1120" y="808" class="emph">Cascade = both</text>
    <text x="1120" y="830" class="tiny">at practical cost</text>
  </g>
</svg>
