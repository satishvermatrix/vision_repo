<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="980" viewBox="0 0 1480 980" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#152033"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#254a73"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a4d3a"/><stop offset="100%" stop-color="#1f6348"/>
    </linearGradient>
    <linearGradient id="gBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a3420"/><stop offset="100%" stop-color="#5c4228"/>
    </linearGradient>
    <linearGradient id="gPurp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2a55"/><stop offset="100%" stop-color="#4a3670"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f4a5c"/><stop offset="100%" stop-color="#276078"/>
    </linearGradient>
    <linearGradient id="gOk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d5c38"/><stop offset="100%" stop-color="#247a48"/>
    </linearGradient>
    <linearGradient id="gBad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5c2a2a"/><stop offset="100%" stop-color="#7a3434"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 28px ui-sans-serif, system-ui, sans-serif; fill: #f2f6fc; }
      .sub { font: 400 14px ui-sans-serif, system-ui, sans-serif; fill: #8fa3bf; }
      .boxh { font: 700 14px ui-sans-serif, system-ui, sans-serif; fill: #f2f6fc; }
      .boxs { font: 400 12px ui-sans-serif, system-ui, sans-serif; fill: #b8c7da; }
      .mono { font: 500 11px ui-monospace, Menlo, monospace; fill: #c9d6e8; }
      .stage { font: 700 12px ui-sans-serif, system-ui, sans-serif; fill: #7d93ad; letter-spacing: 0.06em; }
      .ok { font: 700 12px ui-sans-serif, system-ui, sans-serif; fill: #7dffb0; }
      .bad { font: 700 12px ui-sans-serif, system-ui, sans-serif; fill: #ff9b9b; }
      .emph { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: #e8c48a; }
      .big { font: 700 16px ui-sans-serif, system-ui, sans-serif; fill: #f2f6fc; }
      .tiny { font: 400 11px ui-sans-serif, system-ui, sans-serif; fill: #8fa3bf; }
    </style>
  </defs>

  <rect width="1480" height="980" fill="url(#bg)"/>
  <text x="48" y="42" class="title">PE Failure Modes — What Cascade Fixes / Doesn’t</text>
  <text x="48" y="68" class="sub">PE-Core retrieval + VLM verification  ·  cascade helps precision, not every PE weakness</text>

  <!-- Legend -->
  <rect x="48" y="88" width="1384" height="44" rx="10" fill="#141e2c" stroke="#3a4f68"/>
  <text x="68" y="116" class="ok">Cascade helps</text>
  <text x="220" y="116" class="bad">Cascade does not fix</text>
  <text x="460" y="116" class="emph">Partially / depends</text>
  <text x="680" y="116" class="tiny">“Cascade” = PE shortlist → VLM confirm with definition + confidence</text>

  <!-- Failure mode cards -->
  <text x="48" y="168" class="stage">FAILURE MODES</text>

  <!-- Row 1 -->
  <g filter="url(#soft)">
    <rect x="48" y="184" width="450" height="200" rx="14" fill="#101824" stroke="#2a3c52"/>
    <text x="68" y="216" class="boxh">1. Semantic lookalikes</text>
    <text x="68" y="244" class="boxs">Crowd / sports / dance near “fight”</text>
    <text x="68" y="266" class="boxs">in embedding space</text>
    <text x="68" y="300" class="ok">✓ Cascade: VLM rejects with definition</text>
    <text x="68" y="324" class="tiny">Main reason for verification stage</text>
    <text x="68" y="356" class="mono">example: crowd_cheer pe=0.23 → fp</text>
  </g>

  <g filter="url(#soft)">
    <rect x="518" y="184" width="450" height="200" rx="14" fill="#101824" stroke="#2a3c52"/>
    <text x="538" y="216" class="boxh">2. Prompt / phrasing miss</text>
    <text x="538" y="244" class="boxs">True event, wrong single prompt</text>
    <text x="538" y="266" class="boxs">(sword missed by “punching”)</text>
    <text x="538" y="300" class="emph">~ PE ensemble helps recall</text>
    <text x="538" y="324" class="bad">✗ If PE never retrieves → VLM never sees it</text>
    <text x="538" y="356" class="tiny">Fix prompts / threshold, not VLM alone</text>
  </g>

  <g filter="url(#soft)">
    <rect x="988" y="184" width="444" height="200" rx="14" fill="#101824" stroke="#2a3c52"/>
    <text x="1008" y="216" class="boxh">3. Negation / composition</text>
    <text x="1008" y="244" class="boxs">“no fight”, “not a punching bag”</text>
    <text x="1008" y="266" class="boxs">poorly handled by cosine match</text>
    <text x="1008" y="300" class="ok">✓ VLM can apply NOT rules</text>
    <text x="1008" y="324" class="bad">✗ PE text side still weak at negation</text>
    <text x="1008" y="356" class="tiny">Put negations in VLM definition</text>
  </g>

  <!-- Row 2 -->
  <g filter="url(#soft)">
    <rect x="48" y="408" width="450" height="200" rx="14" fill="#101824" stroke="#2a3c52"/>
    <text x="68" y="440" class="boxh">4. Fine temporal / order</text>
    <text x="68" y="468" class="boxs">Mean-pool drops motion order</text>
    <text x="68" y="490" class="boxs">“before / after / who struck first”</text>
    <text x="68" y="524" class="emph">~ VLM sees a few frames — limited</text>
    <text x="68" y="548" class="bad">✗ Not true video understanding</text>
    <text x="68" y="580" class="tiny">Need denser frames / video model</text>
  </g>

  <g filter="url(#soft)">
    <rect x="518" y="408" width="450" height="200" rx="14" fill="#101824" stroke="#2a3c52"/>
    <text x="538" y="440" class="boxh">5. No audio</text>
    <text x="538" y="468" class="boxs">Shouts, impacts, gunshots ignored</text>
    <text x="538" y="490" class="boxs">by vision-only PE + frame VLM</text>
    <text x="538" y="524" class="bad">✗ Cascade does not add audio</text>
    <text x="538" y="548" class="tiny">Separate audio model if needed</text>
    <text x="538" y="580" class="tiny">Vision-only by design here</text>
  </g>

  <g filter="url(#soft)">
    <rect x="988" y="408" width="444" height="200" rx="14" fill="#101824" stroke="#2a3c52"/>
    <text x="1008" y="440" class="boxh">6. Chunk boundary / timing</text>
    <text x="1008" y="468" class="boxs">Event split across 2s windows</text>
    <text x="1008" y="490" class="boxs">or diluted by mean-pool</text>
    <text x="1008" y="524" class="emph">~ Overlap / shorter chunks help</text>
    <text x="1008" y="548" class="bad">✗ Cascade doesn’t fix bad windows</text>
    <text x="1008" y="580" class="tiny">Chunking is upstream of both models</text>
  </g>

  <!-- Row 3 summary boxes -->
  <text x="48" y="646" class="stage">SUMMARY</text>

  <g filter="url(#soft)">
    <rect x="48" y="662" width="450" height="160" rx="14" fill="url(#gOk)" stroke="#4e9a6e"/>
    <text x="68" y="696" class="boxh">Cascade DOES fix</text>
    <text x="68" y="728" class="boxs">• Lookalike FPs after PE retrieve</text>
    <text x="68" y="752" class="boxs">• Definition / NOT rules in language</text>
    <text x="68" y="776" class="boxs">• Need for rationale / audit trail</text>
    <text x="68" y="800" class="boxs">• Final precision of the report</text>
  </g>

  <g filter="url(#soft)">
    <rect x="518" y="662" width="450" height="160" rx="14" fill="url(#gBad)" stroke="#a05050"/>
    <text x="538" y="696" class="boxh">Cascade does NOT fix</text>
    <text x="538" y="728" class="boxs">• PE misses (FN never shortlisted)</text>
    <text x="538" y="752" class="boxs">• Audio / true temporal reasoning</text>
    <text x="538" y="776" class="boxs">• Bad chunk boundaries</text>
    <text x="538" y="800" class="boxs">• Need for a generative captioner alone</text>
  </g>

  <g filter="url(#soft)">
    <rect x="988" y="662" width="444" height="160" rx="14" fill="url(#gPurp)" stroke="#7a62a0"/>
    <text x="1008" y="696" class="boxh">Still tune outside VLM</text>
    <text x="1008" y="728" class="boxs">• Prompt ensemble &amp; PE threshold</text>
    <text x="1008" y="752" class="boxs">• Chunk length / overlap / frames</text>
    <text x="1008" y="776" class="boxs">• Confirm threshold &amp; VLM frames</text>
    <text x="1008" y="800" class="boxs">• Human review of ok_ / fp_ clips</text>
  </g>

  <rect x="48" y="848" width="1384" height="100" rx="14" fill="#141e2c" stroke="#3a4f68"/>
  <text x="68" y="886" class="big">Takeaway</text>
  <text x="68" y="916" class="boxs">Cascade converts PE’s recall-oriented mistakes (FPs) into something the VLM can reject. It cannot resurrect events PE never retrieved, nor add senses PE never had (audio, fine time).</text>
</svg>
