<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-label="High-level system flow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#152033"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#254a73"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a4d3a"/>
      <stop offset="100%" stop-color="#1f6348"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a3420"/>
      <stop offset="100%" stop-color="#5c4228"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2a55"/>
      <stop offset="100%" stop-color="#4a3670"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f4a5c"/>
      <stop offset="100%" stop-color="#276078"/>
    </linearGradient>
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d4a2d"/>
      <stop offset="100%" stop-color="#3a5f3a"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8fa3bf"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 30px ui-sans-serif, system-ui, sans-serif; fill: #f2f6fc; }
      .sub { font: 400 15px ui-sans-serif, system-ui, sans-serif; fill: #8fa3bf; }
      .boxh { font: 700 16px ui-sans-serif, system-ui, sans-serif; fill: #f2f6fc; }
      .boxs { font: 400 12px ui-sans-serif, system-ui, sans-serif; fill: #b8c7da; }
      .lbl { font: 600 11px ui-sans-serif, system-ui, sans-serif; fill: #9eb0c7; }
      .stage { font: 700 12px ui-sans-serif, system-ui, sans-serif; fill: #7d93ad; letter-spacing: 0.08em; }
      .note { font: 400 12px ui-sans-serif, system-ui, sans-serif; fill: #7a8ea8; }
      .pill { font: 600 11px ui-sans-serif, system-ui, sans-serif; fill: #d5deeb; }
    </style>
  </defs>

  <rect width="1400" height="720" fill="url(#bg)"/>
  <text x="56" y="48" class="title">Video Event Search — System Flow</text>
  <text x="56" y="74" class="sub">Retrieve candidates with vision–language embeddings, then verify with a VLM</text>

  <!-- Stage labels -->
  <text x="90" y="120" class="stage">INGEST</text>
  <text x="320" y="120" class="stage">EMBED</text>
  <text x="560" y="120" class="stage">INDEX</text>
  <text x="800" y="120" class="stage">RETRIEVE</text>
  <text x="1040" y="120" class="stage">VERIFY</text>
  <text x="1260" y="120" class="stage">OUTPUT</text>

  <!-- Main pipeline boxes -->
  <g filter="url(#soft)">
    <rect x="48" y="140" width="180" height="100" rx="16" fill="url(#g1)" stroke="#5a7eab" stroke-width="1.5"/>
    <text x="138" y="182" text-anchor="middle" class="boxh">Videos</text>
    <text x="138" y="206" text-anchor="middle" class="boxs">event clips</text>
  </g>

  <g filter="url(#soft)">
    <rect x="278" y="140" width="180" height="100" rx="16" fill="url(#g1)" stroke="#5a7eab" stroke-width="1.5"/>
    <text x="368" y="178" text-anchor="middle" class="boxh">Chunking</text>
    <text x="368" y="200" text-anchor="middle" class="boxs">short time windows</text>
    <text x="368" y="218" text-anchor="middle" class="boxs">sampled frames</text>
  </g>

  <g filter="url(#soft)">
    <rect x="508" y="140" width="180" height="100" rx="16" fill="url(#g2)" stroke="#4e9a6e" stroke-width="1.5"/>
    <text x="598" y="178" text-anchor="middle" class="boxh">PE Encoder</text>
    <text x="598" y="200" text-anchor="middle" class="boxs">vision embeddings</text>
    <text x="598" y="218" text-anchor="middle" class="boxs">shared vector space</text>
  </g>

  <g filter="url(#soft)">
    <rect x="738" y="140" width="180" height="100" rx="16" fill="url(#g3)" stroke="#a07848" stroke-width="1.5"/>
    <text x="828" y="178" text-anchor="middle" class="boxh">Embedding Store</text>
    <text x="828" y="200" text-anchor="middle" class="boxs">vectors + timestamps</text>
    <text x="828" y="218" text-anchor="middle" class="boxs">per video chunk</text>
  </g>

  <g filter="url(#soft)">
    <rect x="968" y="140" width="180" height="100" rx="16" fill="url(#g4)" stroke="#7a62a0" stroke-width="1.5"/>
    <text x="1058" y="178" text-anchor="middle" class="boxh">Rank / Retrieve</text>
    <text x="1058" y="200" text-anchor="middle" class="boxs">cosine similarity</text>
    <text x="1058" y="218" text-anchor="middle" class="boxs">top-k candidates</text>
  </g>

  <g filter="url(#soft)">
    <rect x="1198" y="140" width="160" height="100" rx="16" fill="url(#g5)" stroke="#4a8aa0" stroke-width="1.5"/>
    <text x="1278" y="182" text-anchor="middle" class="boxh">Clips</text>
    <text x="1278" y="206" text-anchor="middle" class="boxs">report + export</text>
  </g>

  <!-- arrows row 1 -->
  <line x1="228" y1="190" x2="274" y2="190" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="458" y1="190" x2="504" y2="190" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="688" y1="190" x2="734" y2="190" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="918" y1="190" x2="964" y2="190" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Query branch -->
  <g filter="url(#soft)">
    <rect x="508" y="320" width="180" height="90" rx="16" fill="url(#g2)" stroke="#4e9a6e" stroke-width="1.5"/>
    <text x="598" y="356" text-anchor="middle" class="boxh">Text Query</text>
    <text x="598" y="378" text-anchor="middle" class="boxs">event or NLQ prompt</text>
  </g>

  <g filter="url(#soft)">
    <rect x="738" y="320" width="180" height="90" rx="16" fill="url(#g2)" stroke="#4e9a6e" stroke-width="1.5"/>
    <text x="828" y="356" text-anchor="middle" class="boxh">PE Text Encode</text>
    <text x="828" y="378" text-anchor="middle" class="boxs">same vector space</text>
  </g>

  <line x1="688" y1="365" x2="734" y2="365" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>
  <!-- text emb joins ranking -->
  <path d="M828 320 L828 260 L1058 260 L1058 240" fill="none" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>
  <text x="900" y="252" class="lbl">query vector</text>

  <!-- Verification stage -->
  <rect x="48" y="450" width="1310" height="210" rx="18" fill="#101824" stroke="#2a3c52" stroke-width="1.5"/>
  <text x="72" y="482" class="stage">VERIFICATION CASCADE</text>

  <g filter="url(#soft)">
    <rect x="72" y="508" width="220" height="110" rx="16" fill="url(#g4)" stroke="#7a62a0" stroke-width="1.5"/>
    <text x="182" y="548" text-anchor="middle" class="boxh">PE Candidates</text>
    <text x="182" y="572" text-anchor="middle" class="boxs">high recall shortlist</text>
    <text x="182" y="590" text-anchor="middle" class="boxs">may include false positives</text>
  </g>

  <g filter="url(#soft)">
    <rect x="360" y="508" width="220" height="110" rx="16" fill="url(#g1)" stroke="#5a7eab" stroke-width="1.5"/>
    <text x="470" y="548" text-anchor="middle" class="boxh">Frame Sampler</text>
    <text x="470" y="572" text-anchor="middle" class="boxs">frames from candidate</text>
    <text x="470" y="590" text-anchor="middle" class="boxs">window</text>
  </g>

  <g filter="url(#soft)">
    <rect x="648" y="508" width="240" height="110" rx="16" fill="url(#g5)" stroke="#4a8aa0" stroke-width="1.5"/>
    <text x="768" y="548" text-anchor="middle" class="boxh">Vision-Language Model</text>
    <text x="768" y="572" text-anchor="middle" class="boxs">confirm event present?</text>
    <text x="768" y="590" text-anchor="middle" class="boxs">confidence + rationale</text>
  </g>

  <g filter="url(#soft)">
    <rect x="956" y="508" width="180" height="110" rx="16" fill="url(#g6)" stroke="#5a905a" stroke-width="1.5"/>
    <text x="1046" y="548" text-anchor="middle" class="boxh">Decision</text>
    <text x="1046" y="572" text-anchor="middle" class="boxs">confirm if present</text>
    <text x="1046" y="590" text-anchor="middle" class="boxs">&amp; confident enough</text>
  </g>

  <g filter="url(#soft)">
    <rect x="1198" y="508" width="140" height="110" rx="16" fill="url(#g3)" stroke="#a07848" stroke-width="1.5"/>
    <text x="1268" y="548" text-anchor="middle" class="boxh">Results</text>
    <text x="1268" y="572" text-anchor="middle" class="boxs">ok / false</text>
    <text x="1268" y="590" text-anchor="middle" class="boxs">positive</text>
  </g>

  <line x1="292" y1="563" x2="356" y2="563" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="580" y1="563" x2="644" y2="563" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="888" y1="563" x2="952" y2="563" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1136" y1="563" x2="1194" y2="563" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>

  <!-- connector from retrieve to verify -->
  <path d="M1058 240 L1058 420 L182 420 L182 508" fill="none" stroke="#8fa3bf" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="220" y="412" class="lbl">hand off candidates</text>

  <!-- also link final clips from verify path conceptually - the top right clips is for NLQ; bottom is cascade output -->
  <path d="M1268 508 L1268 280 L1278 280 L1278 240" fill="none" stroke="#8fa3bf" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- legend pills -->
  <rect x="56" y="680" width="12" height="12" rx="3" fill="#254a73"/>
  <text x="74" y="691" class="pill">data / frames</text>
  <rect x="210" y="680" width="12" height="12" rx="3" fill="#1f6348"/>
  <text x="228" y="691" class="pill">PE embedding</text>
  <rect x="370" y="680" width="12" height="12" rx="3" fill="#4a3670"/>
  <text x="388" y="691" class="pill">retrieval</text>
  <rect x="500" y="680" width="12" height="12" rx="3" fill="#276078"/>
  <text x="518" y="691" class="pill">VLM verify</text>
  <text x="700" y="691" class="note">Index path (top)  ·  Query path (middle)  ·  Confirm path (bottom)</text>
</svg>
