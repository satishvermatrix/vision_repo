<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="980" viewBox="0 0 1480 980">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#152033"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#254a73"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a4d3a"/><stop offset="100%" stop-color="#1f6348"/>
    </linearGradient>
    <linearGradient id="gBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a3420"/><stop offset="100%" stop-color="#5c4228"/>
    </linearGradient>
    <linearGradient id="gPurp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2a55"/><stop offset="100%" stop-color="#4a3670"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f4a5c"/><stop offset="100%" stop-color="#276078"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5c2a2a"/><stop offset="100%" stop-color="#7a3434"/>
    </linearGradient>
    <linearGradient id="gOk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d5c38"/><stop offset="100%" stop-color="#247a48"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8fa3bf"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 28px ui-sans-serif, system-ui, sans-serif; fill: #f2f6fc; }
      .sub { font: 400 14px ui-sans-serif, system-ui, sans-serif; fill: #8fa3bf; }
      .boxh { font: 700 15px ui-sans-serif, system-ui, sans-serif; fill: #f2f6fc; }
      .boxs { font: 400 12px ui-sans-serif, system-ui, sans-serif; fill: #b8c7da; }
      .mono { font: 500 12px ui-monospace, Menlo, monospace; fill: #c9d6e8; }
      .lbl { font: 600 11px ui-sans-serif, system-ui, sans-serif; fill: #9eb0c7; }
      .stage { font: 700 12px ui-sans-serif, system-ui, sans-serif; fill: #7d93ad; letter-spacing: 0.06em; }
      .ok { font: 700 13px ui-sans-serif, system-ui, sans-serif; fill: #7dffb0; }
      .bad { font: 700 13px ui-sans-serif, system-ui, sans-serif; fill: #ff9b9b; }
      .emph { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: #e8c48a; }
      .big { font: 700 18px ui-sans-serif, system-ui, sans-serif; fill: #f2f6fc; }
      .tiny { font: 400 11px ui-sans-serif, system-ui, sans-serif; fill: #8fa3bf; }
    </style>
  </defs>

  <rect width="1480" height="980" fill="url(#bg)"/>
  <text x="48" y="42" class="title">Contrastive Alignment vs Vision-Language Model</text>
  <text x="48" y="68" class="sub">Why PE-Core / CLIP-style models excel at retrieval &amp; classification — but not VQA or deep video understanding</text>

  <!-- LEFT: Contrastive -->
  <rect x="40" y="96" width="680" height="520" rx="18" fill="#101824" stroke="#3d7a55" stroke-width="2"/>
  <text x="60" y="130" class="stage">CONTRASTIVE  (PE-Core / CLIP-style)</text>
  <text x="60" y="158" class="big">Two encoders → one score</text>

  <g filter="url(#soft)">
    <rect x="70" y="180" width="200" height="70" rx="12" fill="url(#gBlue)" stroke="#5a7eab"/>
    <text x="170" y="210" text-anchor="middle" class="boxh">Video / Image</text>
    <text x="170" y="232" text-anchor="middle" class="tiny">encode → vector v</text>
  </g>
  <g filter="url(#soft)">
    <rect x="320" y="180" width="200" height="70" rx="12" fill="url(#gBrown)" stroke="#a07848"/>
    <text x="420" y="210" text-anchor="middle" class="boxh">Text label / query</text>
    <text x="420" y="232" text-anchor="middle" class="tiny">encode → vector q</text>
  </g>
  <g filter="url(#soft)">
    <rect x="530" y="180" width="160" height="70" rx="12" fill="url(#gPurp)" stroke="#7a62a0"/>
    <text x="610" y="210" text-anchor="middle" class="boxh">v · q</text>
    <text x="610" y="232" text-anchor="middle" class="tiny">similarity</text>
  </g>
  <line x1="270" y1="215" x2="316" y2="215" stroke="#8fa3bf" stroke-width="1.5" opacity="0.4"/>
  <line x1="520" y1="215" x2="526" y2="215" stroke="#8fa3bf" stroke-width="1.5" opacity="0.4"/>

  <text x="60" y="290" class="emph">Learns: “does this text match this visual?”</text>
  <text x="60" y="320" class="boxs">• Shared embedding space (global alignment)</text>
  <text x="60" y="344" class="boxs">• Fast: precompute video embeddings, reuse forever</text>
  <text x="60" y="368" class="boxs">• Open-vocab: any text string becomes a classifier</text>
  <text x="60" y="392" class="boxs">• Great ranking / top-k retrieval over huge corpora</text>

  <rect x="60" y="420" width="640" height="80" rx="12" fill="#163028" stroke="#3d7a55"/>
  <text x="80" y="450" class="ok">Works well for</text>
  <text x="80" y="478" class="boxs">Retrieval · zero-shot classification · event candidate search · tagging</text>

  <rect x="60" y="520" width="640" height="72" rx="12" fill="#2a1818" stroke="#7a3434"/>
  <text x="80" y="548" class="bad">Weak / not designed for</text>
  <text x="80" y="576" class="boxs">Free-form answers · “why / how / what happens next” · multi-hop reasoning</text>

  <!-- RIGHT: VLM -->
  <rect x="760" y="96" width="680" height="520" rx="18" fill="#101824" stroke="#4a8aa0" stroke-width="2"/>
  <text x="780" y="130" class="stage">VLM / MLLM  (Qwen-VL, PE-Lang + LLM, …)</text>
  <text x="780" y="158" class="big">Vision tokens → language decoder</text>

  <g filter="url(#soft)">
    <rect x="790" y="180" width="180" height="70" rx="12" fill="url(#gBlue)" stroke="#5a7eab"/>
    <text x="880" y="210" text-anchor="middle" class="boxh">Video frames</text>
    <text x="880" y="232" text-anchor="middle" class="tiny">→ visual tokens</text>
  </g>
  <g filter="url(#soft)">
    <rect x="1000" y="180" width="180" height="70" rx="12" fill="url(#gPurp)" stroke="#7a62a0"/>
    <text x="1090" y="210" text-anchor="middle" class="boxh">+ Question</text>
    <text x="1090" y="232" text-anchor="middle" class="tiny">text tokens</text>
  </g>
  <g filter="url(#soft)">
    <rect x="1210" y="180" width="200" height="70" rx="12" fill="url(#gTeal)" stroke="#4a8aa0"/>
    <text x="1310" y="210" text-anchor="middle" class="boxh">LLM decoder</text>
    <text x="1310" y="232" text-anchor="middle" class="tiny">next tokens…</text>
  </g>

  <text x="780" y="290" class="emph">Learns: “generate the right answer tokens”</text>
  <text x="780" y="320" class="boxs">• Cross-attention / fused multimodal context</text>
  <text x="780" y="344" class="boxs">• Can compose, explain, count, read OCR, follow instructions</text>
  <text x="780" y="368" class="boxs">• Natural fit for VQA and video understanding dialogue</text>
  <text x="780" y="392" class="boxs">• Slower / heavier — usually run on shortlisted clips</text>

  <rect x="780" y="420" width="640" height="80" rx="12" fill="#163028" stroke="#3d7a55"/>
  <text x="800" y="450" class="ok">Works well for</text>
  <text x="800" y="478" class="boxs">VQA · captioning · verification · “is a fight happening?” + rationale</text>

  <rect x="780" y="520" width="640" height="72" rx="12" fill="#2a1818" stroke="#7a3434"/>
  <text x="800" y="548" class="bad">Not ideal alone for</text>
  <text x="800" y="576" class="boxs">Billion-scale ANN search — no cheap reusable global index vector</text>

  <!-- Bottom: why -->
  <rect x="40" y="640" width="1400" height="300" rx="18" fill="#0e1622" stroke="#2a3c52"/>
  <text x="60" y="678" class="stage">WHY THE DIFFERENCE?</text>

  <text x="60" y="716" class="boxh">1. Output type</text>
  <text x="280" y="716" class="boxs">Contrastive → scalar similarity.  VLM → sequence of words. Only the latter can answer open questions.</text>

  <text x="60" y="752" class="boxh">2. Training signal</text>
  <text x="280" y="752" class="boxs">Contrastive matches pairs globally (“fight” near fight frames). It never practices generating explanations.</text>

  <text x="60" y="788" class="boxh">3. Information bottleneck</text>
  <text x="280" y="788" class="boxs">One pooled vector is enough to rank “fight vs not”. VQA needs many tokens to preserve detail, OCR, order, relations.</text>

  <text x="60" y="824" class="boxh">4. Compute pattern</text>
  <text x="280" y="824" class="boxs">Index once with PE-Core, search with dots. Use a VLM only on top-k candidates (your cascade) for understanding / confirm.</text>

  <rect x="60" y="852" width="1360" height="64" rx="12" fill="#1a2f48" stroke="#3a5a78"/>
  <text x="80" y="880" class="emph">Practical recipe</text>
  <text x="80" y="900" class="boxs">Contrastive PE-Core = recall / retrieval engine.   VLM (or PE-Lang + LLM) = precision / understanding engine.   Together = scalable video search + trustworthy answers.</text>
</svg>
