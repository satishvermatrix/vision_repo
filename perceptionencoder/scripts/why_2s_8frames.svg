<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="900" viewBox="0 0 1480 900" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#152033"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#254a73"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a4d3a"/><stop offset="100%" stop-color="#1f6348"/>
    </linearGradient>
    <linearGradient id="gBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a3420"/><stop offset="100%" stop-color="#5c4228"/>
    </linearGradient>
    <linearGradient id="gPurp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2a55"/><stop offset="100%" stop-color="#4a3670"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f4a5c"/><stop offset="100%" stop-color="#276078"/>
    </linearGradient>
    <linearGradient id="gOk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d5c38"/><stop offset="100%" stop-color="#247a48"/>
    </linearGradient>
    <linearGradient id="gBad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5c2a2a"/><stop offset="100%" stop-color="#7a3434"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 28px ui-sans-serif, system-ui, sans-serif; fill: #f2f6fc; }
      .sub { font: 400 14px ui-sans-serif, system-ui, sans-serif; fill: #8fa3bf; }
      .boxh { font: 700 15px ui-sans-serif, system-ui, sans-serif; fill: #f2f6fc; }
      .boxs { font: 400 12px ui-sans-serif, system-ui, sans-serif; fill: #b8c7da; }
      .mono { font: 600 13px ui-monospace, Menlo, monospace; fill: #c9d6e8; }
      .stage { font: 700 12px ui-sans-serif, system-ui, sans-serif; fill: #7d93ad; letter-spacing: 0.06em; }
      .ok { font: 700 13px ui-sans-serif, system-ui, sans-serif; fill: #7dffb0; }
      .bad { font: 700 13px ui-sans-serif, system-ui, sans-serif; fill: #ff9b9b; }
      .emph { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: #e8c48a; }
      .big { font: 700 22px ui-sans-serif, system-ui, sans-serif; fill: #f2f6fc; }
      .hero { font: 700 36px ui-sans-serif, system-ui, sans-serif; fill: #7dffb0; }
      .tiny { font: 400 11px ui-sans-serif, system-ui, sans-serif; fill: #8fa3bf; }
    </style>
  </defs>

  <rect width="1480" height="900" fill="url(#bg)"/>
  <text x="48" y="42" class="title">Why 2s Windows × 8 Frames?</text>
  <text x="48" y="68" class="sub">Design defaults for PE-Core chunk embeddings — heuristics, not model hard limits</text>

  <!-- Hero choice -->
  <g filter="url(#soft)">
    <rect x="48" y="90" width="680" height="100" rx="16" fill="url(#gOk)" stroke="#4e9a6e"/>
    <text x="388" y="135" text-anchor="middle" class="hero">2 seconds</text>
    <text x="388" y="168" text-anchor="middle" class="boxs">time localization unit  ·  one searchable chunk</text>
  </g>
  <g filter="url(#soft)">
    <rect x="752" y="90" width="680" height="100" rx="16" fill="url(#gOk)" stroke="#4e9a6e"/>
    <text x="1092" y="135" text-anchor="middle" class="hero">8 frames</text>
    <text x="1092" y="168" text-anchor="middle" class="boxs">uniform samples inside each window  ·  then mean-pool</text>
  </g>

  <!-- Reminder -->
  <rect x="48" y="210" width="1384" height="48" rx="12" fill="#141e2c" stroke="#3a4f68"/>
  <text x="68" y="240" class="emph">Reminder:</text>
  <text x="170" y="240" class="boxs">PE encodes each frame independently (spatial only). We mean-pool → one vector. N frames is a budget choice, not an architecture cap.</text>

  <!-- Why 2s -->
  <text x="48" y="292" class="stage">WHY 2-SECOND WINDOWS</text>

  <g filter="url(#soft)">
    <rect x="48" y="308" width="330" height="170" rx="14" fill="url(#gBlue)" stroke="#5a7eab"/>
    <text x="68" y="342" class="boxh">Localize events</text>
    <text x="68" y="372" class="boxs">Search returns a time range,</text>
    <text x="68" y="394" class="boxs">not a whole video.</text>
    <text x="68" y="424" class="ok">2s ≈ actionable clip</text>
    <text x="68" y="448" class="tiny">easy to review / export / verify</text>
  </g>

  <g filter="url(#soft)">
    <rect x="398" y="308" width="330" height="170" rx="14" fill="url(#gBlue)" stroke="#5a7eab"/>
    <text x="418" y="342" class="boxh">Match event timescale</text>
    <text x="418" y="372" class="boxs">Fight / fall / punch moments</text>
    <text x="418" y="394" class="boxs">often unfold in 1–3 seconds.</text>
    <text x="418" y="424" class="ok">Short enough to stay “on event”</text>
    <text x="418" y="448" class="tiny">long enough to catch the action</text>
  </g>

  <g filter="url(#soft)">
    <rect x="748" y="308" width="330" height="170" rx="14" fill="url(#gPurp)" stroke="#7a62a0"/>
    <text x="768" y="342" class="boxh">Avoid dilution</text>
    <text x="768" y="372" class="boxs">Longer windows (e.g. 10s)</text>
    <text x="768" y="394" class="boxs">mix event + unrelated frames.</text>
    <text x="768" y="424" class="bad">Mean-pool washes the signal</text>
    <text x="768" y="448" class="tiny">worse retrieval precision</text>
  </g>

  <g filter="url(#soft)">
    <rect x="1098" y="308" width="334" height="170" rx="14" fill="url(#gBrown)" stroke="#a07848"/>
    <text x="1118" y="342" class="boxh">Index size tradeoff</text>
    <text x="1118" y="372" class="boxs">Shorter ⇒ more chunks</text>
    <text x="1118" y="394" class="boxs">(better localization, bigger index).</text>
    <text x="1118" y="424" class="emph">2s is a sweet spot</text>
    <text x="1118" y="448" class="tiny">vs 0.5s (too many) / 5s+ (too coarse)</text>
  </g>

  <!-- Why 8 frames -->
  <text x="48" y="518" class="stage">WHY 8 FRAMES PER WINDOW</text>

  <g filter="url(#soft)">
    <rect x="48" y="534" width="330" height="170" rx="14" fill="url(#gTeal)" stroke="#4a8aa0"/>
    <text x="68" y="568" class="boxh">Cover the window</text>
    <text x="68" y="598" class="boxs">At ~4 fps sampling over 2s,</text>
    <text x="68" y="620" class="boxs">8 frames span the chunk</text>
    <text x="68" y="642" class="boxs">without decoding every frame.</text>
    <text x="68" y="670" class="ok">Uniform linspace in [start, end)</text>
  </g>

  <g filter="url(#soft)">
    <rect x="398" y="534" width="330" height="170" rx="14" fill="url(#gTeal)" stroke="#4a8aa0"/>
    <text x="418" y="568" class="boxh">Cost ≈ linear in N</text>
    <text x="418" y="598" class="boxs">Each frame = one PE forward</text>
    <text x="418" y="620" class="boxs">+ one OpenCV seek/decode.</text>
    <text x="418" y="642" class="boxs">16–32 frames ≈ 2–4× slower</text>
    <text x="418" y="670" class="tiny">with little gain under mean-pool</text>
  </g>

  <g filter="url(#soft)">
    <rect x="748" y="534" width="330" height="170" rx="14" fill="url(#gPurp)" stroke="#7a62a0"/>
    <text x="768" y="568" class="boxh">Diminishing returns</text>
    <text x="768" y="598" class="boxs">Nearby frames look almost alike.</text>
    <text x="768" y="620" class="boxs">Mean-pool → average appearance.</text>
    <text x="768" y="642" class="bad">Extra frames ≠ motion model</text>
    <text x="768" y="670" class="tiny">order / dynamics still discarded</text>
  </g>

  <g filter="url(#soft)">
    <rect x="1098" y="534" width="334" height="170" rx="14" fill="url(#gGreen)" stroke="#4e9a6e"/>
    <text x="1118" y="568" class="boxh">Stabilize the vector</text>
    <text x="1118" y="598" class="boxs">1 frame is brittle (blur, cut).</text>
    <text x="1118" y="620" class="boxs">8 frames average out noise</text>
    <text x="1118" y="642" class="boxs">inside the short window.</text>
    <text x="1118" y="670" class="ok">Robust enough for retrieval</text>
  </g>

  <!-- Bottom line -->
  <rect x="48" y="730" width="1384" height="140" rx="16" fill="#101824" stroke="#2a3c52"/>
  <text x="68" y="768" class="stage">BOTTOM LINE</text>
  <text x="68" y="800" class="big">2s = localization granularity   ·   8 frames = cheap coverage of that window</text>
  <text x="68" y="834" class="boxs">Tunable via --chunk-sec / --frames. Raising frames helps a little; raising window length usually hurts precision under mean-pool.</text>
  <text x="68" y="858" class="tiny">True temporal understanding still needs a VLM (or a video encoder) — frame count alone won’t get you there.</text>
</svg>
